[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "efficientgraphbench"
version = "0.1.0"
description = "Reproducible hardware-aware graph learning benchmarks"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "torch>=2.6,<3", "torch-geometric>=2.7,<3", "numpy>=1.26,<3",
  "pandas>=2.2,<4", "psutil>=6,<8", "pyyaml>=6,<7",
  "typer>=0.16,<1", "rich>=13,<15",
  "scipy>=1.11,<2",
  "threadpoolctl>=3,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]
tables = ["openpyxl>=3.1,<4", "pdfplumber>=0.11,<0.12"]
setup = ["uv>=0.8,<1"]
ogb = ["ogb>=1.3.6"]

[project.scripts]
egbench = "efficientgraphbench.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = [".python", ".uv-cache", ".venv", "src/efficientgraphbench/resources/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
efficientgraphbench = ["resources/environments/*/*", "resources/vendor/*"]
