# First validate the college CUDA environment with a small graph and short budgets.
dataset: texas
models: [gcn, graphsage, gat, gatv2, appnp, sgc, mlp, sgformer_pyg]
seeds: [1]
device: cuda
output_dir: experiments/college-progressive-smoke
progressive:
  progression_strategy: deterministic_nested
  progression_seed: 42
  selection_metric: val_f1_macro
  min_candidates: 8
  stages:
    - name: initial
      graph_fraction: 0.5
      additional_epochs: 2
    - name: full
      graph_fraction: 1.0
      additional_epochs: 2
